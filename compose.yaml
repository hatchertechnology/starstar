# Local development stack (PostgreSQL + API/UI).
# Credentials and plain HTTP here are for local development only; do not use in production.
services:
  db:
    image: docker.io/library/postgres:17-bookworm
    environment:
      POSTGRES_DB: starstar
      POSTGRES_USER: starstar
      POSTGRES_PASSWORD: ${STARSTAR_DB_PASSWORD:-starstar-dev}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starstar -d starstar"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      STARSTAR_DATABASE_URL: ${STARSTAR_DATABASE_URL:-postgres://starstar:starstar-dev@db:5432/starstar}
      STARSTAR_BIND: 0.0.0.0:8080
      STARSTAR_PUBLIC_URL: http://127.0.0.1:8080
      STARSTAR_ALLOW_INSECURE_HTTP: "1"
      STARSTAR_SETUP_TOKEN: ${STARSTAR_SETUP_TOKEN:-}

volumes:
  postgres-data:
