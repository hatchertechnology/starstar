[package]
name = "starstar-cli"
description = "Command-line interface for the starstar 3D printer management system"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "starstar_cli"
path = "src/lib.rs"

[[bin]]
name = "starstar"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "form", "rustls"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
starstar-shared.workspace = true
thiserror.workspace = true
url.workspace = true
webbrowser.workspace = true

[dev-dependencies]
axum.workspace = true
starstar-api = { path = "../api" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
