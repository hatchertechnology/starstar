sonar.organization=hatchertechnology
sonar.projectKey=hatchertechnology_starstar
sonar.sourceEncoding=UTF-8

sonar.sources=crates/api/src,crates/cli/src,crates/shared/src,web/app,Dockerfile,compose.yaml
sonar.tests=crates/api/tests,crates/cli/tests,web/test

sonar.exclusions=**/target/**,**/node_modules/**,web/.nuxt/**,web/.output/**,web/.data/**,web/coverage/**,web/dist/**
sonar.coverage.exclusions=Dockerfile,compose.yaml,web/app/assets/**,**/*.d.ts

sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=target/llvm-cov.lcov

sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
