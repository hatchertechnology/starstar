apiVersion: v1
kind: PersistentVolume
metadata:
  name: starstar-print-library
spec:
  claimRef:
    namespace: starstar
    name: starstar-print-library
  storageClassName: zfs-local
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  local:
    path: /hatch1/services/starstar/print-library
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - thor
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: starstar-print-library
  namespace: starstar
spec:
  volumeName: starstar-print-library
  storageClassName: zfs-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
