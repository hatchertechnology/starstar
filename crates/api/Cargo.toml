[package]
name = "starstar-api"
description = "HTTP API for the starstar 3D printer management system"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
percent-encoding = "2.3"
futures-util.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "qoi"] }
flate2 = "1"
argon2.workspace = true
axum.workspace = true
base64.workspace = true
diqwest.workspace = true
digest_auth.workspace = true
getrandom.workspace = true
ipnet.workspace = true
reqwest.workspace = true
rmcp.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
starstar-shared.workspace = true
subtle.workspace = true
thiserror.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio = { workspace = true, features = ["time", "sync", "signal"] }
url.workspace = true

[dev-dependencies]
futures-util.workspace = true
md-5.workspace = true
tokio = { workspace = true, features = ["time"] }
tempfile.workspace = true
tower.workspace = true
