[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/api",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/kerryhatcher/starstar"
authors = ["Kerry Hatcher"]

[workspace.dependencies]
starstar-shared = { path = "crates/shared" }


axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
diqwest = "3"
digest_auth = "0.3"
futures-util = "0.3"
md-5 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
