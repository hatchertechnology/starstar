name: CI & SonarQube Cloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test, and Analyze
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: starstar
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: starstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starstar -d starstar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CARGO_TERM_COLOR: always
      CI: 1
      NUXT_TELEMETRY_DISABLED: 1
      STARSTAR_TEST_DATABASE_URL: postgres://starstar:ci-${{ github.run_id }}@127.0.0.1:5432/starstar

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@d7fc31c26763d448f2a8836afda46149eac7705d # cargo-llvm-cov

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust format check
        run: cargo fmt --check

      - name: Rust Clippy report
        run: cargo clippy --workspace --all-targets --message-format=json > clippy-report.json

      - name: Rust tests and coverage
        run: cargo llvm-cov --workspace --lcov --output-path target/llvm-cov.lcov

      - name: Web install, typecheck, and coverage
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run postinstall
          npm --prefix web run typecheck
          npm --prefix web run test:coverage
          sed -i 's|^SF:app/|SF:web/app/|' web/coverage/lcov.info

      - name: Check SONAR_TOKEN availability
        id: sonar_check
        env:
          HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          echo "enabled=${HAS_SONAR_TOKEN}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_SONAR_TOKEN}" != "true" ]; then
            echo "::warning::SONAR_TOKEN secret is not set; skipping SonarQube Cloud scan"
          fi

      - name: SonarQube Cloud scan
        if: steps.sonar_check.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.rust.lcov.reportPaths=${{ github.workspace }}/target/llvm-cov.lcov
            -Dsonar.rust.clippyReport.reportPaths=${{ github.workspace }}/clippy-report.json

  container:
    name: Container image build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: starstar
          POSTGRES_PASSWORD: smoke-${{ github.run_id }}
          POSTGRES_DB: starstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U starstar -d starstar"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: starstar:ci
          cache-from: type=gha,scope=starstar-image
          cache-to: type=gha,scope=starstar-image,mode=max

      - name: Smoke test image
        env:
          DB_URL: postgres://starstar:smoke-${{ github.run_id }}@127.0.0.1:5432/starstar
        run: scripts/container-smoke.sh starstar:ci "$DB_URL"

      - name: Compose health and hardening (Docker Compose)
        run: scripts/compose-check.sh docker starstar:ci
